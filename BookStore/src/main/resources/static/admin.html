<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Books Admin | BookStore</title>

    <style>
        *{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#252a34;font-family:Arial,sans-serif}
        header{height:65px;background:#292f3b;color:white}
        .wrap{width:min(1120px,94%);margin:auto}.head{height:100%;display:flex;align-items:center;justify-content:space-between}
        header a{color:white;text-decoration:none;font-weight:bold}.brand{font-size:20px}
        main{padding:28px 0}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:22px}
        .panel{padding:20px;background:white;border:1px solid #e6e8ed;border-radius:9px}
        h1{margin:0 0 6px;font-size:28px}h2{margin:0 0 15px;font-size:21px}
        .muted{color:#747c88;font-size:13px}
        button{border:0;border-radius:6px;padding:10px 13px;cursor:pointer;font-weight:bold}
        button:disabled{opacity:.5;cursor:not-allowed}
        .blue{background:#4285dc;color:white}.yellow{background:#f3c544;color:#382d08}.red{background:#e4545d;color:white}.green{background:#2f9e68;color:white}
        table{width:100%;border-collapse:collapse;margin-top:15px}
        th,td{padding:12px 9px;border-bottom:1px solid #eceef2;text-align:left;font-size:14px}
        th{color:#747c88;font-size:12px}
        tr.selected{background:#f1f3ff}
        .details{margin-top:12px;border-collapse:collapse;width:100%}
        .details td{border:1px solid #d9dce2;padding:10px}
        .details td:first-child{width:38%;font-weight:bold}
        .cover{display:block;max-width:180px;max-height:220px;object-fit:contain;margin:18px 0}
        .form{display:none;margin-top:18px;padding-top:17px;border-top:1px solid #eceef2}
        .form.show{display:block}
        input,textarea{width:100%;padding:10px;margin:6px 0 11px;border:1px solid #dfe2e8;border-radius:6px}
        textarea{min-height:75px;resize:vertical}
        .actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
        .toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px}
        .toolbar label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:bold}
        .toolbar input{width:auto;margin:0}
        .badge-out{display:inline-block;padding:3px 8px;border-radius:6px;background:#fdebea;color:#b8312f;font-size:12px;font-weight:bold}
        .badge-low{color:#b26a00;font-weight:bold}
        .restock{display:none;margin-top:16px;padding:14px;border-radius:8px;background:#eef7f1}
        .restock.show{display:block}
        .restock.empty{background:#fff0e7}
        .restock .row{display:flex;gap:8px;align-items:center}
        .restock input{margin:0;width:110px}
        .notice{display:none;margin:12px 0;padding:11px;border-radius:6px;background:#fff0e7;color:#93482f}
        .notice.ok{background:#e7f5ed;color:#26714f}
        @media(max-width:760px){.layout{grid-template-columns:1fr}.table-wrap{overflow-x:auto}}
    </style>
</head>
<body>
<header>
    <div class="wrap head">
        <a class="brand" href="/">📚 BookStore Admin</a>
        <div>
            <span id="adminName" style="margin-right:18px"></span>
            <a class="admin-only" href="/admin/orders" style="margin-right:18px;display:none">Orders</a>
            <a class="admin-only" href="/admin/users" style="margin-right:18px;display:none">Users</a>
            <a href="/">Store</a>
        </div>
    </div>
</header>

<main class="wrap">
    <div id="notice" class="notice"></div>
    <div id="noShop" class="notice" style="display:none">
        You do not have a shop yet. <a href="/open-shop">Open your shop</a> so your books appear under your shop name.
    </div>
    <div class="layout">
        <section class="panel">
            <h1 id="pageTitle">Books Admin</h1>
            <div id="summary" class="muted"></div>
            <div class="toolbar">
                <button class="blue" id="addButton">Add New Book</button>
                <label><input type="checkbox" id="outOnly"> Out of stock only</label>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th><th>Book Name</th><th>Author</th><th>Price</th><th>Stock</th>
                        <th class="admin-only" style="display:none">Seller</th><th></th>
                    </tr>
                    </thead>
                    <tbody id="bookRows"></tbody>
                </table>
            </div>
        </section>

        <section class="panel">
            <h2>Book Details</h2>
            <div id="bookDetails" class="muted">Choose a book to see its details.</div>

            <div id="restockBox" class="restock">
                <strong id="restockTitle">Add stock</strong>
                <p id="restockHint" class="muted" style="margin:6px 0 10px"></p>
                <div class="row">
                    <input id="restockAmount" type="number" min="1" max="100000" value="10">
                    <button class="green" id="restockButton">Add copies</button>
                </div>
            </div>

            <form id="bookForm" class="form">
                <h2 id="formTitle">Add Book</h2>
                <input id="bookId" type="hidden">
                <label>Book name<input id="title" required></label>
                <label>Author<input id="author" required></label>
                <label>Price<input id="price" type="number" min="0" step="0.01" required></label>
                <label>Stock (copies available)<input id="stock" type="number" min="0" step="1" value="0" required></label>
                <label>Category<input id="categoryName"></label>
                <label>Image URL<input id="imageUrl"></label>
                <label>Description<textarea id="description"></textarea></label>
                <div class="actions">
                    <button class="blue" type="submit">Save</button>
                    <button class="yellow" type="button" id="cancelButton">Cancel</button>
                </div>
            </form>

            <div class="actions" id="selectedActions" style="display:none">
                <button class="yellow" id="editButton">Edit</button>
                <button class="red" id="deleteButton">Delete</button>
            </div>
        </section>
    </div>
</main>

<script>
    const API = '';
    const $ = s => document.querySelector(s);
    let books = [];
    let selectedBook = null;

    // ---------- auth ----------
    const getToken = () => localStorage.getItem('token');
    function getUser() {
        try { return JSON.parse(localStorage.getItem('kitapUser') || 'null'); }
        catch { return null; }
    }
    const hasRole = r => { const u = getUser(); return !!u && Array.isArray(u.roles) && u.roles.includes(r); };
    const isAdmin = () => hasRole('ROLE_ADMIN');
    const isSeller = () => hasRole('ROLE_SELLER') || isAdmin();

    // ---------- helpers ----------
    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
        );
    }
    function money(v) {
        return new Intl.NumberFormat('en-US').format(Number(v) || 0) + ' ₸';
    }
    function notice(text, ok = false) {
        const el = $('#notice');
        el.textContent = text;
        el.className = ok ? 'notice ok' : 'notice';
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4500);
    }
    const stockOf = b => Number((b && b.stock) || 0);

    async function api(path, options = {}) {
        const headers = {'Content-Type':'application/json', ...(options.headers || {})};
        const token = getToken();
        if (token) headers.Authorization = 'Bearer ' + token;

        const response = await fetch(API + path, {...options, headers});
        const text = await response.text();
        let data;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; }

        if (!response.ok) {
            if (response.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('kitapUser');
                location.href = '/login';
            }
            let message = (data && typeof data === 'object' && (data.error || data.message))
                || (typeof data === 'string' && data && data.length < 200 ? data : '')
                || `Request failed (${response.status})`;
            if (response.status === 403 && message === 'Forbidden') {
                message = 'Access denied: you do not have permission for this action.';
            }
            throw new Error(message);
        }
        return data;
    }

    // ---------- list ----------
    function visibleBooks() {
        return $('#outOnly').checked ? books.filter(b => stockOf(b) <= 0) : books;
    }

    function stockCell(b) {
        const s = stockOf(b);
        if (s <= 0) return '<span class="badge-out">Out of stock</span>';
        if (s <= 5) return `<span class="badge-low">${s} (low)</span>`;
        return String(s);
    }

    function renderBooks() {
        const admin = isAdmin();
        const out = books.filter(b => stockOf(b) <= 0).length;
        $('#summary').textContent = `${books.length} books · ${out} out of stock`;

        const list = visibleBooks();
        $('#bookRows').innerHTML = list.length ? list.map(book => `
      <tr data-id="${esc(book.id)}" class="${selectedBook && selectedBook.id === book.id ? 'selected' : ''}">
        <td>${esc(book.id)}</td>
        <td>${esc(book.title)}</td>
        <td>${esc(book.author)}</td>
        <td>${money(book.price)}</td>
        <td>${stockCell(book)}</td>
        ${admin ? `<td>${esc(book.ownerName || '—')}</td>` : ''}
        <td><button class="blue" onclick="selectBook(${Number(book.id)})">Show Details</button></td>
      </tr>
    `).join('') : `<tr><td colspan="${admin ? 7 : 6}">${$('#outOnly').checked ? 'No books are out of stock.' : 'No books yet.'}</td></tr>`;
    }

    async function loadBooks() {
        try {
            // ADMIN барлығын көреді, SELLER тек өзінің кітаптарын
            books = await api(isAdmin() ? '/api/books' : '/api/books/mine');
            renderBooks();
        } catch (error) {
            notice(error.message);
            $('#bookRows').innerHTML = '<tr><td colspan="7">Could not load books.</td></tr>';
        }
    }

    $('#outOnly').onchange = renderBooks;

    // ---------- details ----------
    function renderDetails() {
        const b = selectedBook;
        if (!b) return;

        $('#bookDetails').innerHTML = `
      <table class="details">
        <tr><td>Book ID</td><td>${esc(b.id)}</td></tr>
        <tr><td>Book Name</td><td>${esc(b.title)}</td></tr>
        <tr><td>Book Author</td><td>${esc(b.author)}</td></tr>
        <tr><td>Book Price</td><td>${money(b.price)}</td></tr>
        <tr><td>In stock</td><td>${stockOf(b) <= 0 ? '<span class="badge-out">Out of stock</span>' : esc(stockOf(b))}</td></tr>
        <tr><td>Category</td><td>${esc(b.categoryName || '')}</td></tr>
        <tr><td>Seller</td><td>${esc(b.ownerName || '—')}</td></tr>
        <tr><td>Description</td><td>${esc(b.description || '')}</td></tr>
      </table>
      ${b.imageUrl ? `<img class="cover" src="${esc(b.imageUrl)}" alt="${esc(b.title)}">` : ''}
    `;

        const box = $('#restockBox');
        box.classList.add('show');
        box.classList.toggle('empty', stockOf(b) <= 0);
        $('#restockTitle').textContent = stockOf(b) <= 0 ? 'Oops! This book is sold out' : 'Add stock';
        $('#restockHint').textContent = stockOf(b) <= 0
            ? 'Add copies so customers can buy it again.'
            : `Currently ${stockOf(b)} copies. The amount below is ADDED to it.`;

        $('#selectedActions').style.display = 'flex';
    }

    window.selectBook = async id => {
        try {
            selectedBook = await api('/api/books/' + id);
            renderBooks();
            renderDetails();
        } catch (error) { notice(error.message); }
    };

    // ---------- restock ----------
    $('#restockButton').onclick = async () => {
        if (!selectedBook) return;
        const amount = Number($('#restockAmount').value);
        if (!Number.isInteger(amount) || amount < 1) {
            notice('Enter a whole number of copies (1 or more).');
            return;
        }
        try {
            selectedBook = await api(`/api/books/${selectedBook.id}/restock?amount=${amount}`, {method:'POST'});
            await loadBooks();
            renderDetails();
            notice(`Added ${amount} copies. Now in stock: ${stockOf(selectedBook)}.`, true);
        } catch (error) { notice(error.message); }
    };

    // ---------- form ----------
    function openForm(book = null) {
        $('#bookForm').reset();
        $('#bookId').value = book?.id || '';
        $('#title').value = book?.title || '';
        $('#author').value = book?.author || '';
        $('#price').value = book?.price ?? '';
        $('#stock').value = book ? stockOf(book) : 0;
        $('#categoryName').value = book?.categoryName || '';
        $('#imageUrl').value = book?.imageUrl || '';
        $('#description').value = book?.description || '';
        $('#formTitle').textContent = book ? 'Update Book' : 'Add Book';
        $('#bookForm').classList.add('show');
    }

    function closeForm() {
        $('#bookForm').classList.remove('show');
    }

    $('#addButton').onclick = () => openForm();
    $('#editButton').onclick = () => selectedBook && openForm(selectedBook);
    $('#cancelButton').onclick = closeForm;

    $('#deleteButton').onclick = async () => {
        if (!selectedBook || !confirm(`Delete "${selectedBook.title}"?`)) return;
        try {
            await api('/api/books/' + selectedBook.id, {method:'DELETE'});
            selectedBook = null;
            $('#bookDetails').textContent = 'Choose a book to see its details.';
            $('#selectedActions').style.display = 'none';
            $('#restockBox').classList.remove('show');
            await loadBooks();
            notice('Book deleted.', true);
        } catch (error) { notice(error.message); }
    };

    $('#bookForm').onsubmit = async event => {
        event.preventDefault();
        const id = $('#bookId').value;
        const stock = Number($('#stock').value);

        if (!Number.isInteger(stock) || stock < 0) {
            notice('Stock must be a whole number (0 or more).');
            return;
        }

        const book = {
            title: $('#title').value.trim(),
            author: $('#author').value.trim(),
            price: Number($('#price').value),
            stock,
            categoryName: $('#categoryName').value.trim(),
            imageUrl: $('#imageUrl').value.trim(),
            description: $('#description').value.trim()
        };

        // Жаңа кітапқа категория міндетті (backend талабы)
        if (!id && !book.categoryName) {
            notice('Category is required for a new book.');
            return;
        }

        try {
            const saved = await api('/api/books' + (id ? '/' + id : ''), {
                method: id ? 'PUT' : 'POST',
                body: JSON.stringify(book)
            });
            closeForm();
            if (id && selectedBook) selectedBook = saved;
            await loadBooks();
            if (id && selectedBook) renderDetails();
            notice(id ? 'Book updated.' : 'Book added.', true);
        } catch (error) { notice(error.message); }
    };

    // ---------- start ----------
    (async function init() {
        if (!getToken()) { location.href = '/login'; return; }

        // Рөлдердің ең жаңа күйін аламыз (админ жаңа рөл берген болуы мүмкін)
        try {
            const me = await api('/api/me');
            localStorage.setItem('kitapUser', JSON.stringify(me));
        } catch { return; }

        if (!isSeller()) {
            notice('You do not have access to this page. Ask an admin to make you a seller.');
            setTimeout(() => location.href = '/', 2500);
            return;
        }

        const u = getUser();
        $('#adminName').textContent = '👤 ' + (u?.username || u?.email || '');
        $('#pageTitle').textContent = isAdmin() ? 'Books Admin' : 'My Books';
        document.querySelectorAll('.admin-only').forEach(el => {
            el.style.display = isAdmin() ? '' : 'none';
        });

        // Сатушының дүкені болса, атын көрсетеміз (жоқ болса 404, елемейміз)
        try {
            const shop = await api('/api/shops/mine');
            $('#pageTitle').textContent = '🏬 ' + shop.name + (isAdmin() ? ' (admin)' : '');
        } catch {
            // Дүкені жоқ қызметкерге дүкен ашуды ұсынамыз
            $('#noShop').style.display = 'block';
        }

        loadBooks();
    })();
</script>
</body>
</html>
