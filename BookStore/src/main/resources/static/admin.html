<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Books Admin | BookStore</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#252a34;font-family:Arial,sans-serif}
        header{height:65px;background:#292f3b;color:white}
        .wrap{width:min(1120px,94%);margin:auto}.head{height:100%;display:flex;align-items:center;justify-content:space-between}
        header a{color:white;text-decoration:none;font-weight:bold}.brand{font-size:20px}
        main{padding:28px 0}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
        .panel{padding:20px;background:white;border:1px solid #e6e8ed;border-radius:9px}
        h1{margin:0 0 18px;font-size:28px}h2{margin:0 0 15px;font-size:21px}
        button{border:0;border-radius:6px;padding:10px 13px;cursor:pointer;font-weight:bold}
        .blue{background:#4285dc;color:white}.yellow{background:#f3c544;color:#382d08}.red{background:#e4545d;color:white}
        table{width:100%;border-collapse:collapse;margin-top:15px}
        th,td{padding:12px 9px;border-bottom:1px solid #eceef2;text-align:left;font-size:14px}
        th{color:#747c88;font-size:12px}
        tr.selected{background:#f1f3ff}
        .details{margin-top:12px;border-collapse:collapse;width:100%}
        .details td{border:1px solid #d9dce2;padding:10px}
        .details td:first-child{width:38%;font-weight:bold}
        .cover{display:block;max-width:180px;max-height:220px;object-fit:contain;margin:18px 0}
        .form{display:none;margin-top:18px;padding-top:17px;border-top:1px solid #eceef2}
        .form.show{display:block}
        input,textarea{width:100%;padding:10px;margin:6px 0 11px;border:1px solid #dfe2e8;border-radius:6px}
        textarea{min-height:75px;resize:vertical}
        .actions{display:flex;gap:8px;margin-top:15px}
        .notice{display:none;margin:12px 0;padding:11px;border-radius:6px;background:#fff0e7;color:#93482f}
        @media(max-width:760px){.layout{grid-template-columns:1fr}.table-wrap{overflow-x:auto}}
    </style>
</head>
<body>
<header>
    <div class="wrap head">
        <a class="brand" href="/">📚 BookStore Admin</a>
        <div>
            <span id="adminName" style="margin-right:18px"></span>
            <a href="/">Store</a>
        </div>
    </div>
</header>

<main class="wrap">
    <div id="notice" class="notice"></div>
    <div class="layout">
        <section class="panel">
            <h1>Books Admin</h1>
            <button class="blue" id="addButton">Add New Book</button>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr><th>ID</th><th>Book Name</th><th>Author</th><th>Price</th><th></th></tr>
                    </thead>
                    <tbody id="bookRows"></tbody>
                </table>
            </div>
        </section>

        <section class="panel">
            <h2>Book Details</h2>
            <div id="bookDetails" class="muted">Choose a book to see its details.</div>

            <form id="bookForm" class="form">
                <h2 id="formTitle">Add Book</h2>
                <input id="bookId" type="hidden">
                <label>Book name<input id="title" required></label>
                <label>Author<input id="author" required></label>
                <label>Price<input id="price" type="number" min="0" step="0.01" required></label>
                <label>Category<input id="categoryName"></label>
                <label>Image URL<input id="imageUrl"></label>
                <label>Description<textarea id="description"></textarea></label>
                <div class="actions">
                    <button class="blue" type="submit">Save</button>
                    <button class="yellow" type="button" id="cancelButton">Cancel</button>
                </div>
            </form>

            <div class="actions" id="selectedActions" style="display:none">
                <button class="yellow" id="editButton">Edit</button>
                <button class="red" id="deleteButton">Delete</button>
            </div>
        </section>
    </div>
</main>

<script>
    const API = '';
    const $ = s => document.querySelector(s);
    let books = [];
    let selectedBook = null;

    // ---------- auth ----------
    const getToken = () => localStorage.getItem('token');
    function getUser() {
        try { return JSON.parse(localStorage.getItem('kitapUser') || 'null'); }
        catch { return null; }
    }

    // Логин жоқ болса, логин бетіне
    if (!getToken()) {
        location.href = '/login';
    }
    const currentUser = getUser();
    $('#adminName').textContent = '👤 ' + (currentUser?.username || currentUser?.email || '');

    // ---------- helpers ----------
    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
        );
    }
    function money(v) {
        return new Intl.NumberFormat('en-US').format(Number(v) || 0) + ' ₸';
    }
    function notice(text) {
        $('#notice').textContent = text;
        $('#notice').style.display = 'block';
        setTimeout(() => $('#notice').style.display = 'none', 4500);
    }

    async function api(path, options = {}) {
        const headers = {'Content-Type':'application/json', ...(options.headers || {})};
        const token = getToken();
        if (token) headers.Authorization = 'Bearer ' + token;

        const response = await fetch(API + path, {...options, headers});
        const text = await response.text();
        let data;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; }

        if (!response.ok) {
            if (response.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('kitapUser');
                location.href = '/login';
            }
            let message = (data && typeof data === 'object' && (data.error || data.message))
                || (typeof data === 'string' && data && data.length < 200 ? data : '')
                || `Request failed (${response.status})`;
            if (response.status === 403) message = 'Access denied: only ADMIN can do this.';
            throw new Error(message);
        }
        return data;
    }

    // ---------- books ----------
    async function loadBooks() {
        try {
            books = await api('/api/books');
            $('#bookRows').innerHTML = books.map(book => `
      <tr data-id="${esc(book.id)}">
        <td>${esc(book.id)}</td>
        <td>${esc(book.title)}</td>
        <td>${esc(book.author)}</td>
        <td>${money(book.price)}</td>
        <td><button class="blue" onclick="selectBook(${Number(book.id)})">Show Details</button></td>
      </tr>
    `).join('');
        } catch (error) {
            notice(error.message);
            $('#bookRows').innerHTML = '<tr><td colspan="5">Could not load books.</td></tr>';
        }
    }

    window.selectBook = async id => {
        try {
            selectedBook = await api('/api/books/' + id);
            document.querySelectorAll('#bookRows tr').forEach(row =>
                row.classList.toggle('selected', Number(row.dataset.id) === id)
            );

            $('#bookDetails').innerHTML = `
      <table class="details">
        <tr><td>Book ID</td><td>${esc(selectedBook.id)}</td></tr>
        <tr><td>Book Name</td><td>${esc(selectedBook.title)}</td></tr>
        <tr><td>Book Author</td><td>${esc(selectedBook.author)}</td></tr>
        <tr><td>Book Price</td><td>${money(selectedBook.price)}</td></tr>
        <tr><td>Category</td><td>${esc(selectedBook.categoryName || '')}</td></tr>
        <tr><td>Description</td><td>${esc(selectedBook.description || '')}</td></tr>
      </table>
      ${selectedBook.imageUrl
                ? `<img class="cover" src="${esc(selectedBook.imageUrl)}" alt="${esc(selectedBook.title)}">`
                : ''}
    `;
            $('#selectedActions').style.display = 'flex';
        } catch (error) { notice(error.message); }
    };

    function openForm(book = null) {
        $('#bookForm').reset();
        $('#bookId').value = book?.id || '';
        $('#title').value = book?.title || '';
        $('#author').value = book?.author || '';
        $('#price').value = book?.price ?? '';
        $('#categoryName').value = book?.categoryName || '';
        $('#imageUrl').value = book?.imageUrl || '';
        $('#description').value = book?.description || '';
        $('#formTitle').textContent = book ? 'Update Book' : 'Add Book';
        $('#bookForm').classList.add('show');
    }

    function closeForm() {
        $('#bookForm').classList.remove('show');
    }

    $('#addButton').onclick = () => openForm();
    $('#editButton').onclick = () => selectedBook && openForm(selectedBook);
    $('#cancelButton').onclick = closeForm;

    $('#deleteButton').onclick = async () => {
        if (!selectedBook || !confirm(`Delete "${selectedBook.title}"?`)) return;
        try {
            await api('/api/books/' + selectedBook.id, {method:'DELETE'});
            selectedBook = null;
            $('#bookDetails').textContent = 'Choose a book to see its details.';
            $('#selectedActions').style.display = 'none';
            await loadBooks();
            notice('Book deleted.');
        } catch (error) { notice(error.message); }
    };

    $('#bookForm').onsubmit = async event => {
        event.preventDefault();
        const id = $('#bookId').value;
        const book = {
            title: $('#title').value.trim(),
            author: $('#author').value.trim(),
            price: Number($('#price').value),
            categoryName: $('#categoryName').value.trim(),
            imageUrl: $('#imageUrl').value.trim(),
            description: $('#description').value.trim()
        };

        // Жаңа кітапқа категория міндетті (backend талабы)
        if (!id && !book.categoryName) {
            notice('Category is required for a new book.');
            return;
        }

        try {
            await api('/api/books' + (id ? '/' + id : ''), {
                method: id ? 'PUT' : 'POST',
                body: JSON.stringify(book)
            });
            closeForm();
            const wasEdit = !!id;
            if (wasEdit && selectedBook) await window.selectBook(Number(id));
            await loadBooks();
            notice(wasEdit ? 'Book updated.' : 'Book added.');
        } catch (error) { notice(error.message); }
    };

    loadBooks();
</script>
</body>
</html>
