<!doctype html>
<html lang="kk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кіру · kitap</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            color: #18231d;
            background: #f6f4ef;
            font-family: Arial, sans-serif;
        }

        .visual {
            position: relative;
            display: grid;
            place-items: center;
            padding: 50px;
            background: #dbe6d4;
        }

        .visual h1 {
            font-size: clamp(36px, 5vw, 62px);
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .visual h1 span { color: #527751; }

        .back {
            position: absolute;
            top: 28px;
            left: 30px;
            color: #245c43;
            font-weight: bold;
            text-decoration: none;
        }

        .side {
            display: grid;
            place-items: center;
            padding: 30px;
        }

        .form { width: min(410px, 100%); }

        .brand {
            display: inline-block;
            margin-bottom: 42px;
            color: #245c43;
            font-size: 25px;
            font-weight: 800;
            text-decoration: none;
        }

        h2 { margin-bottom: 8px; font-size: 30px; }
        .muted { color: #788179; }

        .tabs {
            display: flex;
            margin: 24px 0;
            border-bottom: 1px solid #e5e5de;
        }

        .tab {
            padding: 12px 16px;
            border: 0;
            border-bottom: 2px solid transparent;
            color: #788179;
            background: none;
            font-weight: bold;
            cursor: pointer;
        }

        .tab.active {
            border-color: #245c43;
            color: #245c43;
        }

        label {
            display: block;
            margin: 16px 0;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            height: 48px;
            margin-top: 8px;
            padding: 0 12px;
            border: 1px solid #e4e4dd;
            border-radius: 9px;
            background: white;
        }

        .submit {
            width: 100%;
            height: 49px;
            margin-top: 10px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: #245c43;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            color: #984c30;
            background: #fff0e7;
        }

        .home {
            display: block;
            margin-top: 22px;
            color: #66756a;
            text-align: center;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            body { grid-template-columns: 1fr; }
            .visual { display: none; }
            .side { min-height: 100vh; }
        }
    </style>
</head>
<body>
<aside class="visual">
    <a class="back" href="/">← Дүкенге қайту</a>
    <h1>Өзіңе жақын<br><span>оқиғалар осында.</span></h1>
</aside>

<main class="side">
    <section class="form">
        <a href="/" class="brand">кітап</a>
        <h2 id="title">Қайта оралғаныңа қуаныштымыз</h2>
        <p class="muted" id="subtitle">Аккаунтыңа кіріп, оқуды жалғастыр.</p>

        <div class="tabs">
            <button class="tab active" id="loginTab" type="button">Кіру</button>
            <button class="tab" id="registerTab" type="button">Тіркелу</button>
        </div>

        <div id="message"></div>

        <form id="authForm">
            <label>
                Электрондық пошта
                <input id="email" type="email" autocomplete="email"
                       placeholder="you@example.com" required>
            </label>

            <label id="usernameField" style="display:none">
                Пайдаланушы аты
                <input id="username" autocomplete="name" placeholder="Атыңыз">
            </label>

            <label>
                Құпия сөз
                <input id="password" type="password"
                       autocomplete="current-password" minlength="8" required>
            </label>

            <button class="submit" id="submit" type="submit">Аккаунтқа кіру</button>
        </form>

        <a href="/" class="home">← Басты бетке оралу</a>
    </section>
</main>

<script>
    let isRegister = false;
    const $ = selector => document.querySelector(selector);

    function setMode(register) {
        isRegister = register;
        $('#loginTab').classList.toggle('active', !register);
        $('#registerTab').classList.toggle('active', register);
        $('#usernameField').style.display = register ? 'block' : 'none';
        $('#username').required = register;

        $('#title').textContent = register
            ? 'Жаңа аккаунт аш'
            : 'Қайта оралғаныңа қуаныштымыз';

        $('#subtitle').textContent = register
            ? 'Дүкенге тіркеліп, сүйікті кітабыңды тап.'
            : 'Аккаунтыңа кіріп, оқуды жалғастыр.';

        $('#submit').textContent = register ? 'Тіркелу' : 'Аккаунтқа кіру';
        $('#password').autocomplete = register ? 'new-password' : 'current-password';
        $('#message').style.display = 'none';
    }

    $('#loginTab').onclick = () => setMode(false);
    $('#registerTab').onclick = () => setMode(true);

    async function post(url, payload) {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const text = await response.text();
        let result;
        try {
            result = text ? JSON.parse(text) : null;
        } catch {
            result = text;
        }

        if (!response.ok) {
            const message =
                (result && typeof result === 'object' && (result.error || result.message))
                || 'Мәліметтерді тексеріп, қайта көріңіз.';
            throw new Error(message);
        }
        return result;
    }

    $('#authForm').onsubmit = async event => {
        event.preventDefault();

        const button = $('#submit');
        button.disabled = true;
        button.textContent = 'Күте тұрыңыз…';

        const email = $('#email').value.trim();
        const password = $('#password').value;

        try {
            if (isRegister) {
                // Backend өрісі: userName
                await post('/api/auth/register', {
                    userName: $('#username').value.trim(),
                    email,
                    password
                });
            }

            // Тіркелгеннен кейін де автоматты түрде кіреміз
            const result = await post('/api/auth/login', { email, password });

            localStorage.setItem('token', result.token);
            localStorage.setItem('kitapUser', JSON.stringify(
                result.user || { email, username: email, roles: [] }
            ));

            location.href = '/';
        } catch (error) {
            const message = $('#message');
            message.textContent = error.message || 'Серверге қосылу мүмкін болмады.';
            message.style.display = 'block';
        } finally {
            button.disabled = false;
            button.textContent = isRegister ? 'Тіркелу' : 'Аккаунтқа кіру';
        }
    };
</script>
</body>
</html>
