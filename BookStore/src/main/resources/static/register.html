<div class="text-center mb-8">

    <div class="text-4xl">
        📚
    </div>

    <h1 class="text-3xl font-bold mt-3">
        Welcome Back
    </h1>

    <p class="text-gray-500 mt-2">
        Login to your BookStore account
    </p>

</div>


<form id="login-form">

    <label class="block mb-2 font-medium">
        Email
    </label>

    <input
            id="login-email"
            type="email"
            placeholder="example@gmail.com"
            class="w-full border p-3 rounded-lg mb-5"
            required>


    <label class="block mb-2 font-medium">
        Password
    </label>

    <input
            id="login-password"
            type="password"
            placeholder="Password"
            class="w-full border p-3 rounded-lg mb-6"
            required>


    <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold">

        Login

    </button>

</form>


<p class="text-center text-gray-500 mt-6">

    Don't have an account?

    <a href="register.html"
       class="text-blue-600 font-bold">

        Register

    </a>

</p>
