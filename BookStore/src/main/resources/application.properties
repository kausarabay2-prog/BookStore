spring.application.name=BookStore

# Мәндер environment variable-дан алынады, болмаса ":" кейінгі әдепкі мән қолданылады.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:5757}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT: өндірісте міндетті түрде өз құпия сөзіңізді қойыңыз (кемінде 32 символ)
jwt.secret=${JWT_SECRET:NewtMazeRunnerThomasBooksnewthingblalbablaHArryPotterGer}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Админ: email жазылса, сол пайдаланушыға ROLE_ADMIN беріледі
# (жоқ болса, password арқылы жаңа админ жасалады, кемінде 8 таңба).
app.admin.email=${ADMIN_EMAIL:}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}